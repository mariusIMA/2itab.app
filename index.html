<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone-Peep</title>
<style>
:root{--bg:#3ef9aa;--panel:#fff;--ink:#0f000f;--mute:#785d76;--line:#d8dee4;--accent:#0f5fdb;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0f0f59;--panel:#13031d;--ink:#e8edf2;--mute:#93a1ae;--line:#432a43;--accent:#d06aff;--accent-ink:#0f161d;color-scheme:dark}}
html[data-theme="light"]{--bg:#3ef9aa;--panel:#fff;--ink:#0f000f;--mute:#785d76;--line:#d8dee4;--accent:#0f5fdb;--accent-ink:#fff;color-scheme:light}
html[data-theme="dark"]{--bg:#111111;--panel:#13031d;--ink:#e8edf2;--mute:#93a1ae;--line:#432a43;--accent:#d06aff;--accent-ink:#0f161d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:2rem;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input[type=search],select{max-width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1;min-width:200px}
button{font:inherit;cursor:pointer}
.go,.more,.reset{padding:12px 20px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.reset{background:transparent;color:var(--ink);border:1px solid var(--line)}
.theme-toggle{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font-size:.9rem}
.theme-toggle input{appearance:none;position:relative;width:42px;height:24px;background:var(--line);border-radius:999px;cursor:pointer;transition:background .2s ease;margin:0}
.theme-toggle input::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s ease}
.theme-toggle input:checked{background:var(--accent)}
.theme-toggle input:checked::before{transform:translateX(18px)}
.more{display:block;margin:20px auto 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--mute);margin:8px 0 16px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:80px}
.card:hover{border-color:var(--accent)}
.thumb{position:relative;height:150px;background:var(--bg);border-radius:4px;display:grid;place-items:center;font-size:2rem;color:var(--mute);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.price{font-size:.9rem;color:var(--accent);font-weight:600}.price.none{color:var(--mute);font-weight:400}
.note{color:var(--mute);font-size:.8rem;margin-top:16px}
.card b{font-size:.95rem;line-height:1.3}
.msg{color:var(--mute);padding:24px 0}
dialog{width:min(720px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dhead{display:flex;gap:16px;align-items:center;padding:20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dhead .thumb{width:90px;height:120px;flex:none}
.dhead h2{margin:0;font-size:1.3rem}
.close{margin-left:auto;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--ink)}
.dbody{padding:8px 20px 20px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:6px 8px;border-top:1px solid var(--line);overflow-wrap:anywhere}
th{width:34%;color:var(--mute);font-weight:500}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Phone-Peep</h1>
    <label class="theme-toggle" for="themeToggle">
      <span>Dark mode</span>
      <input id="themeToggle" type="checkbox" aria-label="Toggle light and dark mode">
    </label>
  </header>
  <p class="sub" id="sub">Search phones and view their specifications.</p>
  <form class="search" id="form" role="search">
    <input type="search" id="q" placeholder="Search by model, e.g. Pixel 8" aria-label="Search phones" autofocus>
    <select id="brand" aria-label="Brand"><option value="">All brands</option></select>
    <select id="cur" aria-label="Currency"><option>NOK</option><option>USD</option></select>
    <button class="go" type="submit">Search</button>
    <button class="reset" type="button" id="reset">Clear</button>
  </form>
  <div class="count" id="count" aria-live="polite"></div>
  <div id="view"></div>
</main>
<dialog id="dlg"></dialog>

<script>
const $ = s => document.querySelector(s);
const view = $('#view'), dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async p => { const r = await fetch('/api/' + p); if (!r.ok) throw new Error('Request failed'); return r.json(); };
const label = k => { const t = k.replace(/[_-]+/g, ' ').trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
const val = v => /^https?:\/\/\S+$/.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>` : esc(v);
const fmt = { NOK: new Intl.NumberFormat('nb-NO', { style: 'currency', currency: 'NOK', maximumFractionDigits: 0 }),
              USD: new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }) };
let cur = 'NOK', offset = 0, timer;
try { cur = localStorage.getItem('cur') || 'NOK'; } catch (e) {}
$('#cur').value = cur;
const byId = new Map();

function getThemePreference() {
  try {
    const saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') return saved;
  } catch (e) {}
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const toggle = $('#themeToggle');
  if (toggle) toggle.checked = theme === 'dark';
  try { localStorage.setItem('theme', theme); } catch (e) {}
}

const themeToggle = $('#themeToggle');
if (themeToggle) {
  themeToggle.addEventListener('change', e => applyTheme(e.target.checked ? 'dark' : 'light'));
}
applyTheme(getThemePreference());

const priceText = d => d.price ? '≈ ' + fmt[cur].format(cur === 'NOK' ? d.price.nok : d.price.usd) : (d.priceText || 'Price not listed');
const priceCls = d => d.price || d.priceText ? 'price' : 'price none';
const thumb = d => `<div class="thumb"><span>${esc((d.brand || d.name || '?')[0])}</span>${d.hasImg ? `<img src="/api/img/${d.id}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>`;
const cardHTML = d => `<button class="card" data-id="${d.id}">${thumb(d)}<b>${esc(d.name)}</b><span class="${priceCls(d)}">${esc(priceText(d))}</span></button>`;

function setBrands(counts, q) {
  const sel = $('#brand'), cur0 = sel.value;
  let list = Object.entries(counts || {});
  list = q ? list.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])) : list.sort((a, b) => a[0].localeCompare(b[0]));
  if (cur0 && !counts?.[cur0]) list.push([cur0, 0]);
  const total = Object.values(counts || {}).reduce((x, y) => x + y, 0);
  sel.innerHTML = `<option value="">All brands (${total.toLocaleString()})</option>` +
    list.map(([b, n]) => `<option value="${esc(b)}">${esc(b)} (${n.toLocaleString()})</option>`).join('');
  if (cur0 && Array.from(sel.options).some(o => o.value === cur0)) {
    sel.value = cur0;
  } else {
    sel.value = '';
  }
}

async function run(append = false) {
  if (!append) { offset = 0; view.innerHTML = '<p class="msg">Loading…</p>'; }
  try {
    const q = $('#q').value;
    const { total, items, brandCounts } = await api(`search?q=${encodeURIComponent(q)}&brand=${encodeURIComponent($('#brand').value)}&offset=${offset}`);
    if (!append) setBrands(brandCounts, q.trim());
    $('#count').textContent = `${total.toLocaleString()} phone${total === 1 ? '' : 's'}`;
    if (!append && !items.length) return view.innerHTML = '<p class="msg">No phones found. Try fewer words or a different spelling.</p>';
    if (!append) view.innerHTML = '<div class="grid"></div><p class="note">Prices are converted from the dataset\'s original currency (BDT) at an approximate current rate.</p>';
    items.forEach(d => byId.set(String(d.id), d));
    view.querySelector('.grid').insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    offset += items.length;
    view.querySelector('.more')?.remove();
    if (offset < total) view.querySelector('.grid').insertAdjacentHTML('afterend', '<button class="more">Show more</button>');
  } catch (e) { view.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}

async function showDevice(id) {
  const d = await api('device/' + id);
  const rows = `<tr><th>Price (${cur})</th><td>${esc(priceText(d))}</td></tr>` +
    Object.entries(d.specs || {}).filter(([, v]) => String(v).trim() !== '')
      .map(([k, v]) => `<tr><th>${esc(label(k))}</th><td>${val(v)}</td></tr>`).join('');
  dlg.innerHTML = `<div class="dhead">${thumb(d)}<h2>${esc(d.name)}</h2><button class="close" data-close>Close</button></div><div class="dbody"><table>${rows}</table></div>`;
  dlg.showModal();
}

function clearFilters() {
  $('#q').value = '';
  $('#brand').value = '';
  run();
}

$('#form').addEventListener('submit', e => { e.preventDefault(); run(); });
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 250); });
$('#brand').addEventListener('change', () => run());
$('#cur').addEventListener('change', e => {
  cur = e.target.value; try { localStorage.setItem('cur', cur); } catch (x) {}
  document.querySelectorAll('.card').forEach(c => { const d = byId.get(c.dataset.id), p = c.querySelector('.price'); if (d && p) p.textContent = priceText(d); });
});
$('#reset').addEventListener('click', clearFilters);
view.addEventListener('click', e => {
  if (e.target.closest('.more')) return run(true);
  const c = e.target.closest('[data-id]'); if (c) showDevice(c.dataset.id);
});
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });

api('meta').then(m => { $('#sub').textContent = `Search ${m.total.toLocaleString()} phones and view their specifications.`; }).catch(() => {});
run();
</script>

<script>
// Magnetic + 3D tilt cards: cards drift toward the mouse, and the card under it tilts toward the cursor.
(() => {
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;   // skip touch screens
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;      // respect accessibility setting

  const RADIUS = 260;  // how far from the cursor cards react (px)
  const PULL = 10;     // max drift toward the cursor (px)
  const LIFT = 0.035;  // extra scale for the card under the cursor
  const TILT = 18;     // max tilt in degrees (use a negative number to flip the direction)
  const GLARE = 0.20;  // brightness of the light spot that follows the cursor (0 = off)

  const css = document.createElement('style');
  css.textContent = `
    #view .card{position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .15s}
    #view .card.mg-on{transition:transform .12s ease-out,border-color .15s}
    #view .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
      transition:opacity .2s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,${GLARE}),transparent 60%)}
    #view .card.mg-on::after{opacity:${GLARE ? 1 : 0}}`;
  document.head.appendChild(css);

  let mx = -9999, my = -9999, active = false, raf = 0;

  function frame() {
    raf = 0;
    const live = active && !document.querySelector('dialog[open]');
    for (const c of document.querySelectorAll('#view .card')) {
      const r = c.getBoundingClientRect();
      const ox = c._mx || 0, oy = c._my || 0;
      let x = 0, y = 0, s = 1, rx = 0, ry = 0, hot = false;
      if (live && r.bottom > -RADIUS && r.top < innerHeight + RADIUS) {
        const w = c.offsetWidth, h = c.offsetHeight;
        const dx = mx - (r.left + r.width / 2 - ox), dy = my - (r.top + r.height / 2 - oy);
        const d = Math.hypot(dx, dy);
        if (d < RADIUS) {
          const k = (1 - d / RADIUS) ** 2 * Math.min(d / 50, 1);  // fades with distance, and near the centre
          x = (dx / (d || 1)) * PULL * k;
          y = (dy / (d || 1)) * PULL * k;
        }
        if (Math.abs(dx) <= w / 2 && Math.abs(dy) <= h / 2) {      // cursor is on this card
          hot = true; s = 1 + LIFT;
          ry = (dx / (w / 2)) * TILT;
          rx = (-dy / (h / 2)) * TILT;
          c.style.setProperty('--gx', ((dx / w + 0.5) * 100).toFixed(1) + '%');
          c.style.setProperty('--gy', ((dy / h + 0.5) * 100).toFixed(1) + '%');
        }
      }
      const t = x || y || hot
        ? `perspective(700px) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(${s})`
        : '';
      if (c._t !== t) { c.style.transform = t; c._t = t; }
      if (c._hot !== hot) { c.classList.toggle('mg-on', hot); c._hot = hot; }
      c._mx = x; c._my = y;
    }
  }

  const queue = () => raf || (raf = requestAnimationFrame(frame));
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; active = true; queue(); }, { passive: true });
  addEventListener('scroll', queue, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { active = false; queue(); });
})();
</script>

<script>
const express = require('express');
const fs = require('fs');
const path = require('path');

const DATA_DIR = path.join(__dirname, 'data');

// ---- CSV parser (handles quotes, commas and newlines inside quotes) ----
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(x => x !== '')) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x !== '')) rows.push(row);
  const head = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

// ---- Exchange rates (live from open.er-api.com, with approximate fallback) ----
// Fallback numbers are approximate and only used if the live fetch fails.
const R = { usdPerBdt: 1 / 122, nokPerBdt: 0.0836, live: false, date: '' };
async function refreshRates() {
  try {
    const j = await (await fetch('https://open.er-api.com/v6/latest/USD', { signal: AbortSignal.timeout(8000) })).json();
    const b = j.rates && j.rates.BDT, n = j.rates && j.rates.NOK;
    if (b > 0 && n > 0) { R.usdPerBdt = 1 / b; R.nokPerBdt = n / b; R.live = true; R.date = j.time_last_update_utc || ''; console.log('Live exchange rates loaded.'); }
  } catch (e) { console.warn('Could not fetch live exchange rates; using approximate fallback.'); }
}
refreshRates();
setInterval(refreshRates, 12 * 3600e3).unref();

function priceOf(i) {
  if (i.pa == null) return null;
  const usd = i.pc === 'USD' ? i.pa : i.pa * R.usdPerBdt;
  const nok = i.pc === 'USD' ? i.pa * (R.nokPerBdt / R.usdPerBdt) : i.pa * R.nokPerBdt;
  return { usd: Math.round(usd), nok: Math.round(nok) };
}

// ---- Text helpers for forgiving search ----
const split = s => String(s).toLowerCase().replace(/([a-z])(\d)/g, '$1 $2').replace(/(\d)([a-z])/g, '$1 $2')
  .replace(/[^a-z0-9\u00c0-\u024f]+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function tokenScore(t, words) {
  const numeric = /^\d+$/.test(t); let best = -1;
  for (const w of words) {
    let sc = -1;
    if (w === t) sc = 0;
    else if (w.startsWith(t)) sc = 0.5;
    else if (!numeric && t.length >= 3 && w.includes(t)) sc = 1.5;
    else if (!numeric && t.length >= 4) {
      const d = Math.min(lev(t, w), lev(t, w.slice(0, t.length)));
      if (d <= (t.length <= 5 ? 1 : 2)) sc = 3 + d;
    }
    if (sc >= 0 && (best < 0 || sc < best)) best = sc;
  }
  return best;
}
function matchScore(item, q) {
  if (!q.tokens.length) return 0;
  if (item.compact.includes(q.compact)) return -1;
  let total = 0;
  for (const t of q.tokens) { const s = tokenScore(t, item.words); if (s < 0) return null; total += s; }
  return total;
}

function readRows(file) {
  const raw = fs.readFileSync(path.join(DATA_DIR, file), 'utf8');
  if (/\.json$/i.test(file)) {
    let j = JSON.parse(raw);
    if (!Array.isArray(j)) j = Object.values(j).find(Array.isArray) || Object.values(j);
    return j.filter(x => x && typeof x === 'object').map(o => Object.fromEntries(
      Object.entries(o).map(([k, v]) => [k, v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v)])));
  }
  return parseCSV(raw);
}

// ---- Load the dataset: any .csv/.json in /data (real files win over "sample") ----
function load() {
  if (!fs.existsSync(DATA_DIR)) fs.mkdirSync(DATA_DIR);
  const all = fs.readdirSync(DATA_DIR).filter(f => /\.(csv|json)$/i.test(f));
  const files = all.filter(f => !/^extra/i.test(f)).sort((a, b) => a.startsWith('sample') - b.startsWith('sample'));
  if (!files.length) { console.error('Put a .csv or .json file in the data folder.'); process.exit(1); }
  const file = files[0];
  let rows = readRows(file);
  if (!rows.length) { console.error('The data file is empty.'); process.exit(1); }
  // Files named extra*.csv / extra*.json are merged in as additional phones.
  const mainKeys = new Set(Object.keys(rows[0]));
  for (const f of all.filter(f => /^extra/i.test(f))) {
    const add = readRows(f);
    const odd = [...new Set(add.flatMap(r => Object.keys(r)))].filter(k => !mainKeys.has(k));
    if (odd.length) console.warn(`Warning: ${f} has columns not in ${file}: ${odd.join(', ')}`);
    rows = rows.concat(add);
    console.log(`Added ${add.length} phones from ${f}`);
  }
  const allKeys = [...new Set(rows.flatMap(r => Object.keys(r)))];
  rows = rows.map(r => Object.fromEntries(allKeys.map(k => [k, r[k] ?? ''])));

  const keys = Object.keys(rows[0]);
  const norm = k => k.toLowerCase().replace(/[^a-z]/g, '');
  const find = re => keys.find(k => re.test(norm(k)));
  const brandK = find(/^(brand|company|manufacturer|maker)/);
  let nameK = find(/^(model|name|device|title|phone)/);
  if (nameK === brandK) nameK = keys.find(k => k !== brandK && /model|name|device|title/.test(norm(k)));
  nameK = nameK || keys.find(k => k !== brandK) || keys[0];
  const imgK = find(/^(image|img|picture|photo|thumbnail)/) ||
    keys.find(k => /^https?:\/\/\S+\.(jpe?g|png|webp)/i.test(rows[0][k]));
  const priceKs = keys.filter(k => /price|cost/i.test(k))
    .sort((a, b) => /usd|dollar/i.test(b) - /usd|dollar/i.test(a));

  const items = rows.map((r, id) => {
    const brand = brandK ? r[brandK] : '';
    let name = r[nameK] || '(unnamed)';
    if (brand && !name.toLowerCase().startsWith(brand.toLowerCase())) name = brand + ' ' + name;
    const img = imgK && /^https?:\/\//i.test(r[imgK]) ? r[imgK] : '';
    let pa = null, pc = 'BDT', pt = '';
    for (const k of priceKs) {
      const v = r[k] || '', m = v.match(/\d[\d,]*(?:\.\d+)?/), n = m ? parseFloat(m[0].replace(/,/g, '')) : NaN;
      if (n > 0) { pa = n; pc = /usd|dollar/i.test(k) || /\$|usd/i.test(v) ? 'USD' : 'BDT'; break; }
      if (v.trim() && !pt) pt = v.trim();
    }
    const sp = split(name);
    return { id, name, brand, img, pa, pc, pt, words: sp.split(' '), compact: sp.replace(/ /g, '') };
  });

  console.log(`Loaded ${items.length} phones from ${file} (name: "${nameK}", brand: "${brandK}", image: "${imgK}", price: ${priceKs.map(k => `"${k}"`).join(', ') || 'none'})`);
  const cov = {};
  for (const i of items) { const c = cov[i.brand || '(none)'] ||= { n: 0, p: 0 }; c.n++; if (i.pa != null) c.p++; }
  const gaps = Object.entries(cov).filter(([, c]) => c.p < c.n).sort((a, b) => (b[1].n - b[1].p) - (a[1].n - a[1].p)).slice(0, 10);
  if (gaps.length) console.log('Brands with missing prices (priced/total): ' + gaps.map(([b, c]) => `${b} ${c.p}/${c.n}`).join(', '));
  return { rows, items, priceKs };
}

const { rows, items, priceKs } = load();
const outItem = i => ({ id: i.id, name: i.name, brand: i.brand, hasImg: !!i.img, price: priceOf(i), priceText: i.pt });
const app = express();

app.get('/api/meta', (req, res) => res.json({ total: items.length, ratesLive: R.live, ratesDate: R.date }));

app.get('/api/search', (req, res) => {
  const sp = split(req.query.q || '');
  const q = { tokens: sp.split(' ').filter(Boolean), compact: sp.replace(/ /g, '') };
  const brand = String(req.query.brand || '');
  const offset = Math.max(0, parseInt(req.query.offset) || 0);
  const matches = [], brandCounts = {};
  for (const i of items) {
    const s = matchScore(i, q);
    if (s === null) continue;
    matches.push([s, i]);
    brandCounts[i.brand || 'Other'] = (brandCounts[i.brand || 'Other'] || 0) + 1;
  }
  let list = brand ? matches.filter(([, i]) => i.brand === brand) : matches;
  if (q.tokens.length) list = list.slice().sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length);
  res.json({ total: list.length, brandCounts, items: list.slice(offset, offset + 48).map(([, i]) => outItem(i)) });
});

app.get('/api/device/:id', (req, res) => {
  const i = items[+req.params.id];
  if (!i) return res.status(404).json({ error: 'Not found' });
  const specs = Object.fromEntries(Object.entries(rows[i.id]).filter(([k]) => !priceKs.includes(k)));
  res.json({ ...outItem(i), specs });
});

// ---- Image proxy by phone id (not by URL, so it can't be used as an open proxy) ----
const imgCache = new Map();
app.get('/api/img/:id', async (req, res) => {
  const i = items[+req.params.id];
  if (!i || !i.img) return res.status(404).end();
  let hit = imgCache.get(i.id);
  if (!hit || (!hit.buf && Date.now() - hit.t > 10 * 60e3)) {
    try {
      const r = await fetch(i.img, { signal: AbortSignal.timeout(8000), headers: { 'User-Agent': 'phone-finder/1.0' } });
      const type = r.headers.get('content-type') || '';
      const buf = Buffer.from(await r.arrayBuffer());
      hit = r.ok && type.startsWith('image/') && buf.length < 3e6 ? { buf, type, t: Date.now() } : { buf: null, t: Date.now() };
    } catch (e) { hit = { buf: null, t: Date.now() }; }
    imgCache.set(i.id, hit);
    if (imgCache.size > 500) imgCache.delete(imgCache.keys().next().value);
  }
  if (!hit.buf) return res.status(404).end();
  res.set('Content-Type', hit.type);
  res.set('Cache-Control', 'public, max-age=604800');
  res.send(hit.buf);
});

app.use(express.static(path.join(__dirname, 'public')));
module.exports = app;
  
</script>
